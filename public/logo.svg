<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>

  <!-- Aircraft silhouette -->
  <g transform="translate(256, 170)">
    <path d="M0-50 L-10-15 L-75 10 L-75 20 L-10 6 L-7 35 L-25 48 L-25 55 L0 45 L25 55 L25 48 L7 35 L10 6 L75 20 L75 10 L10-15 Z" fill="white" opacity="0.9"/>
  </g>

  <!-- AI circuit nodes -->
  <circle cx="370" cy="130" r="6" fill="#38bdf8" opacity="0.7"/>
  <circle cx="400" cy="160" r="4" fill="#38bdf8" opacity="0.5"/>
  <line x1="370" y1="130" x2="400" y2="160" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="140" cy="140" r="5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="110" cy="170" r="4" fill="#06b6d4" opacity="0.4"/>
  <line x1="140" y1="140" x2="110" y2="170" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>

  <!-- Text: Airport -->
  <text x="256" y="330" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">Airport</text>

  <!-- Text: AIOps -->
  <text x="256" y="395" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="url(#accentGradient)" text-anchor="middle">AIOps</text>

  <!-- Accent underline -->
  <rect x="140" y="412" width="232" height="3" rx="1.5" fill="url(#accentGradient)" opacity="0.6"/>
</svg>
